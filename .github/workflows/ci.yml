name: Quality and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-models.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Unit and contract tests without downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -m pytest -m "not integration" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=75 --junitxml=pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            pytest.xml
